<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Situation de jour</title>
<link rel="icon" href="logo.png" type="image/png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="header-content"><div class="header-text"><div class="brand">Maroc Telecom</div><h1>Situation de jour</h1><div class="date" id="date"></div></div><img class="brand-icon" src="logo.png" alt="Icône Maroc Telecom"></div></header>
<div class="wrap"><div id="app"></div><div class="actions"><button class="action copy" id="copyBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg><span>Copier</span></button><button class="action send" id="sendBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg><span>Envoyer</span></button></div><div class="toast" id="toast"></div><button class="reset" id="resetBtn">Remettre tout à zéro</button><button class="reset" id="adminBtn" hidden>📊 Espace administrateur</button></div>
<div class="modal" id="loginModal"><div class="modal-box"><h3 class="modal-title">Envoyer la situation</h3><p class="modal-sub">Entrez votre nom d'utilisateur et votre mot de passe.</p><input class="field" id="username" type="text" autocomplete="username" placeholder="Nom d'utilisateur"><input class="field" id="password" type="password" autocomplete="current-password" placeholder="Password"><div class="modal-actions"><button class="modal-btn cancel" id="cancelLogin">Annuler</button><button class="modal-btn login" id="loginBtn">Envoyer</button></div><div class="small">La situation sera enregistrée dans votre tableau.</div></div></div>
<div class="modal" id="welcomeModal"><div class="modal-box"><h3 class="modal-title" id="wTitle">Bienvenue</h3><p class="modal-sub" id="wSub">Entrez votre nom pour commencer.</p><input class="field" id="wName" type="text" autocomplete="username" placeholder="Votre nom"><input class="field" id="wPass" type="password" autocomplete="new-password" placeholder="Mot de passe" hidden><input class="field" id="wPass2" type="password" autocomplete="new-password" placeholder="Confirmer le mot de passe" hidden><div class="modal-actions"><button class="modal-btn login" id="wBtn">Continuer</button></div><div class="small" id="wMsg"></div><div class="small"><button id="wBack" hidden style="background:none;color:var(--muted);text-decoration:underline;font-size:12px;padding:4px">Changer de nom</button></div></div></div>
<div class="modal" id="adminAuth"><div class="modal-box"><h3 class="modal-title">Espace administrateur</h3><p class="modal-sub">Entrez votre mot de passe pour continuer.</p><input class="field" id="aPass" type="password" autocomplete="current-password" placeholder="Mot de passe"><div class="modal-actions"><button class="modal-btn cancel" id="aCancel">Annuler</button><button class="modal-btn cancel" id="aOut" hidden>Changer de compte</button><button class="modal-btn login" id="aOk">Ouvrir</button></div><div class="small" id="aMsg" style="color:var(--red)"></div></div></div>
<div class="admin" id="adminPanel" hidden><div class="admin-top"><button class="admin-close" id="adminClose">← Retour</button><button class="admin-close" id="adminOut" hidden>Déconnexion</button><h2>Espace administrateur</h2></div><div class="admin-body"><div class="admin-date"><button class="dbtn" id="dPrev" aria-label="Jour précédent">‹</button><input class="field" type="date" id="dPick"><button class="dbtn" id="dNext" aria-label="Jour suivant">›</button><button class="dbtn" id="dRef" aria-label="Actualiser">↻</button></div><div class="small" id="adminMsg" style="margin:0 0 10px;color:var(--muted)"></div><div id="adminContent"></div></div></div>
<script src="script.js"></script>
</body>
</html>
